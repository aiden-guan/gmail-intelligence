name = "gi-tracker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Non-secret defaults only. Secrets go in .dev.vars locally, or `wrangler secret put` when deploying.
# With SUPABASE_URL unset, `wrangler dev` stores events in memory.

[dev]
port = 8787
